<!DOCTYPE html>
<html lang="{{ session.get('language', 'en') }}" dir="{{ 'rtl' if session.get('language') == 'ar' else 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashly AI{% endblock %} — Dashly AI</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="container navbar-inner">

    <a href="{{ url_for('main.home') }}" class="navbar-brand" aria-label="Dashly AI home">
      <span class="brand-dash">Dashly</span><span class="brand-ai">AI</span>
    </a>

    <div class="navbar-links" id="navLinks">
      <a href="{{ url_for('main.home') }}"
         class="nav-link {% if request.endpoint == 'main.home' %}active{% endif %}">
        {{ _("Home") }}
      </a>
      <a href="{{ url_for('main.detect_page') }}"
         class="nav-link {% if request.endpoint == 'main.detect_page' %}active{% endif %}">
        {{ _("Detect") }}
      </a>
      <a href="{{ url_for('main.library_page') }}"
         class="nav-link {% if request.endpoint == 'main.library_page' %}active{% endif %}">
        {{ _("Library") }}
      </a>
      <a href="{{ url_for('main.find_repair_page') }}"
         class="nav-link {% if request.endpoint == 'main.find_repair_page' %}active{% endif %}">
        {{ _("Find Repair") }}
      </a>
      <a href="{{ url_for('main.chatbot_page') }}"
         class="nav-link nav-link-dashly {% if request.endpoint == 'main.chatbot_page' %}active{% endif %}">
        ✦ {{ _("Ask Dashly") }}
      </a>
    </div>

    <div class="navbar-end">
      <div class="lang-toggle" role="group" aria-label="Language selection">
        <a href="{{ url_for('main.set_language', language='en') }}"
           class="lang-pill {% if session.get('language', 'en') == 'en' %}active{% endif %}"
           aria-current="{{ 'true' if session.get('language', 'en') == 'en' else 'false' }}">EN</a>
        <a href="{{ url_for('main.set_language', language='ar') }}"
           class="lang-pill {% if session.get('language', 'en') == 'ar' %}active{% endif %}"
           aria-current="{{ 'true' if session.get('language', 'en') == 'ar' else 'false' }}">AR</a>
      </div>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer" role="contentinfo">
  <div class="container footer-inner">
    <span class="footer-brand">Dashly<span>AI</span></span>
    <span class="footer-copy">{{ _("AI-powered car dashboard icon detection") }}</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
